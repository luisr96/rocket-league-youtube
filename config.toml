[search]
pro = true
playlists = ["ranked-duels", "ranked-doubles", "ranked-standard"]
min_rank = "supersonic-legend"
max_rank = "supersonic-legend"
sort_by = "replay-date"       # replay-date | upload-date
count_per_player = 50         # replays fetched per player (1-200)
pick_list_size = 10

[api]
base_url = "https://ballchasing.com/api"
min_delay_seconds = 1.0       # polite delay between API calls
max_retries = 3

[paths]
history_file = "history.json"
players_file = "players.txt"
log_dir = "logs"
# "auto" = <Windows Documents folder>\My Games\Rocket League\TAGame\Demos,
# which follows OneDrive redirection. Or put a full path in single quotes.
demos_dir = "auto"
output_dir = '%USERPROFILE%\Videos\RocketLeague'

[camera]
# Camera is locked in Player View on the first players.txt player in the match.
# > 0: switch to the Director camera for each kickoff, returning to Player View
# this many seconds after the ball is first touched. 0 = Player View throughout.
kickoff_director_seconds = 2
# true: keep the target focused during the kickoff Director shot (their boost
# meter shows, their name tag is hidden). false: focus is cleared and set again
# when Player View returns.
kickoff_keep_focus = true

[pairs]
# Each video is 2 games of the same player in the same playlist, at most this
# many days apart (consecutive games are preferred automatically).
max_gap_days = 3

[recording]
# Fallback: if the end of a game isn't detected, stop after its length plus this.
buffer_seconds = 30
# Debugging: > 0 records only this many seconds of each game, adds "_debug" to
# the file name and does not mark the games as done (so they can be re-run).
debug_seconds = 0

[obs]
# OBS WebSocket server (Tools > WebSocket Server Settings). Password goes in .env
# as OBS_WEBSOCKET_PASSWORD.
host = "localhost"
port = 4455
capture_source = "Game Capture"   # name of the Game Capture source in your OBS scene
# Started automatically if it isn't already running.
exe = 'C:\Program Files\obs-studio\bin\64bit\obs64.exe'
# Fade to black between the two games: OBS fades to this empty scene (created
# if missing) and back. Set transition_ms = 0 for a hard cut.
transition_scene = "RLVid Black"
transition_ms = 800

[overlay]
# Player names shown at the start of each game (blue left, orange right), as an
# OBS Browser Source added on top of the game scene (created if missing).
enabled = true
source = "RLVid Names"
style = "band"            # band (dimmed strip), outline, or shadow
hold_seconds = 4          # fully visible for this long
fade_out_seconds = 2      # then fades out over this long
fade_in_seconds = 0       # 0 = appears at once

[thumbnail]
# YouTube thumbnail candidates (1280x720 JPG) saved next to each video, taken
# around the target's fastest goal in game 1 (else a teammate's goal in game 1,
# else the target's goal in game 2): 1 s, 0.5 s and 0.1 s before it, 0.4 s
# after it (explosion) and 5 s after it (close-up). Remake them for an existing
# video with: python thumbnails.py "<video>.mp4"
enabled = true
big_name = true           # the target player's name in large letters
layout = "corner"         # corner: name top left (rank emblem top right); center: name centred at the top
rank_icon = true          # rank emblem top right, from overlay/rank_<rank>.png (e.g. rank_supersonic-legend.png)
team_names = false        # all players' names at the bottom (YouTube's length badge covers the bottom right)
names_size = 70           # team names, px (long names shrink to fit)
names_position = "bottom" # team names at the bottom, middle or top
zoom = true               # crop to the middle 70% of the frame
sharpen = true
colours = true            # stronger colours (below) and darker edges
saturation = 1.7          # 1 = unchanged
contrast = 1.25           # 1 = unchanged
# edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'   # if Edge isn't found

[youtube]
# Uploading (upload.py, daily.py). Setup: see README "YouTube setup"; then sign
# in once with: python upload.py --login
client_secrets = "youtube_client_secret.json"   # OAuth client file from Google Cloud
token_file = "youtube_token.json"               # saved sign-in (created by --login)
privacy = "private"           # private until the API project passes Google's audit; publish in YouTube Studio
category_id = "20"            # Gaming
titles_file = "titles.txt"    # title patterns, one per line, used in turn
thumbnail = "1s-before"       # 1s-before, 0.5s-before, 0.1s-before, 0.4s-after or 5s-after
delete_after_upload = true    # delete the video and its data file after upload (thumbnails are kept)

[game]
# Epic launch link for Rocket League. Set "-noeac" in the Epic launcher's
# Rocket League launch options so BakkesMod can load.
epic_launch_uri = "com.epicgames.launcher://apps/9773aa1aa54f4f7b80e44bef04986cea%3A530145df28a24424923f5828cc9031a1%3ASugar?action=launch&silent=true"
bakkesmod_exe = 'C:\Program Files\BakkesMod\BakkesMod.exe'
# Close OBS, Rocket League and BakkesMod at the start of each run and start
# them fresh (after downloading the replays).
fresh_start = true
launch_timeout_seconds = 180
menu_settle_seconds = 8      # wait at the main menu before loading a replay
replay_start_timeout_seconds = 60

[video]
# Used to turn OBS's recording into a standard, seekable MP4 (no re-encoding).
ffmpeg = "ffmpeg"
