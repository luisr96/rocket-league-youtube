<!doctype html>
<!--
  Broadcast-style HUD over the game (an OBS Browser Source, 1920x1080):
  scoreboard with a label + branding strip, player panels with live boost, a stats
  bar for the featured player, a goal wipe, and an intro with all players' names.

  The game's own scoreboard stays on screen; the scoreboard and strip cover it.

  Query parameters:
    brand=LIKE, COMMENT & SUBSCRIBE!
    label=SSL 2v2             in the strip under the scoreboard
    hold=4                    seconds the intro stays up
    scale=1                   size of the scoreboard (top centre)
    top=0                     distance of the scoreboard from the top, px
    meter=off                 POV boost meter in the bottom-right corner: ring, segments, bar or off
    demo=1                    fake, animated data (for previewing the design)

  Data: without demo=1 the page reads /state from the local server started by
  the recorder (rlvid/hudserver.py) ~30 times a second; render(state) draws it
  (see DEMO below for the shape). state.intro {id, match, pov, blue, orange}
  plays the intro whenever its id changes.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --blue: #1f7bff; --orange: #ff6a00; --gold: #ffc53d; --ink: #0b0e18; --ink2: #161b2a; --track: #1c2335;
    --font: Bahnschrift, "DIN Alternate", "Segoe UI", Arial, sans-serif; --scale: 1; --top: 0px;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent;
               font-family: var(--font); font-weight: 700; color: #fff; }
  body.off #score, body.off .players, body.off #stats, body.off #meter { visibility: hidden; }  /* not in a replay */
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Scoreboard ---------- */
  #score { position: absolute; top: var(--top); left: 50%; transform: translateX(-50%) scale(var(--scale));
           transform-origin: top center; display: flex; flex-direction: column; align-items: center; }
  #bar { position: relative; display: flex; height: 64px; overflow: hidden; }
  #bar > div { display: flex; align-items: center; box-sizing: border-box; }
  .tname { width: 250px; background: var(--ink); font-size: 22px; letter-spacing: 3px; }
  .tname.blue { justify-content: flex-end; padding-right: 22px; border-bottom: 4px solid var(--blue);
                clip-path: polygon(0 0,100% 0,100% 100%,22px 100%); }
  .tname.orange { padding-left: 22px; border-bottom: 4px solid var(--orange);
                  clip-path: polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%); }
  .tscore { width: 78px; justify-content: center; font-size: 44px; }
  .tscore.blue { background: var(--blue); } .tscore.orange { background: var(--orange); }
  #clock { width: 150px; justify-content: center; background: var(--ink); font-size: 38px; }
  #clock.ot { color: var(--gold); }
  #strip { position: relative; z-index: 2; width: 640px; height: 36px; background: var(--ink2); display: flex;
           align-items: center; justify-content: center; font-size: 15px; letter-spacing: 3px;
           clip-path: polygon(0 0,100% 0,calc(100% - 20px) 100%,20px 100%); }
  #label { background: var(--gold); color: var(--ink); height: 100%; display: flex; align-items: center;
           padding: 0 21px 0 18px; clip-path: polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%); }
  #brand { display: flex; align-items: center; gap: 10px; padding-left: 18px; text-transform: uppercase;
           background: linear-gradient(100deg, #fff 40%, var(--gold) 50%, #fff 60%); background-size: 600px 100%;
           -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 8s linear infinite; }
  #brand svg { flex: none; }
  @keyframes shimmer { 0%, 80% { background-position: -200px 0; } 100% { background-position: 400px 0; } }

  /* Goal: a wipe in the scoring team's colour crosses the bar; the score changes under it. */
  #bar > #wipe { position: absolute; inset: 0; display: none; justify-content: center; font-size: 46px; font-style: italic;
          letter-spacing: 14px; background: var(--gc); }
  #wipe.blue { animation: wipe 1.2s cubic-bezier(.5,0,.3,1) both; }
  #wipe.orange { animation: wipeR 1.2s cubic-bezier(.5,0,.3,1) both; }
  #bar > #wipe.blue, #bar > #wipe.orange { display: flex; }
  @keyframes wipe { 0% { transform: translateX(-101%); } 30%, 70% { transform: translateX(0); } 100% { transform: translateX(101%); } }
  @keyframes wipeR { 0% { transform: translateX(101%); } 30%, 70% { transform: translateX(0); } 100% { transform: translateX(-101%); } }

  /* ---------- Player panels ---------- */
  .players { position: absolute; top: 18px; width: 330px; display: flex; flex-direction: column; gap: 8px; }
  #pblue { left: 22px; } #porange { right: 22px; }
  .pl { background: var(--ink); padding: 9px 26px 11px 14px; box-shadow: inset 4px 0 0 var(--tc);
        clip-path: polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%); --tc: var(--blue); --hi: #8fc0ff; }
  #porange .pl { padding: 9px 14px 11px 26px; box-shadow: inset -4px 0 0 var(--tc);
                 clip-path: polygon(0 0,100% 0,100% 100%,14px 100%); --tc: var(--orange); --hi: #ffb07a; }
  #pblue .pl.pov { box-shadow: inset 0 0 0 2px var(--gold), inset 4px 0 0 var(--tc); }
  #porange .pl.pov { box-shadow: inset 0 0 0 2px var(--gold), inset -4px 0 0 var(--tc); }
  .pl .row { display: flex; justify-content: space-between; gap: 10px; font-size: 20px; }
  #porange .pl .row { flex-direction: row-reverse; }
  .pl .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl .track { margin-top: 7px; height: 8px; background: var(--track); transform: skewX(-20deg); overflow: hidden; }
  #porange .pl .track { transform: skewX(20deg); display: flex; justify-content: flex-end; }
  .pl .fill { height: 100%; width: 0; background: var(--tc); box-shadow: 0 0 8px var(--tc); transition: width .05s linear; }
  .pl.full .bn { color: var(--hi); }
  .pl.full .track { box-shadow: 0 0 12px var(--tc); }

  /* ---------- Stats bar (featured player) ---------- */
  #stats { position: absolute; bottom: 22px; left: 22px; background: rgba(11,14,24,.85); --sc: var(--orange); --hi: #ffb07a;
           clip-path: polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%); box-shadow: inset 4px 0 0 var(--sc); }
  #stats.blue { --sc: var(--blue); --hi: #8fc0ff; }
  #stats:empty { display: none; }
  #stats .who { padding: 7px 26px 2px 14px; font-size: 15px; letter-spacing: 2px; color: var(--hi); text-transform: uppercase; }
  #stats .sts { display: flex; gap: 16px; padding: 0 30px 8px 14px; }
  #stats .st b { display: block; font-size: 18px; }
  #stats .st i { font-size: 9px; font-style: normal; letter-spacing: 2px; color: #8c94a8; }

  /* ---------- Boost meter (POV player) ---------- */
  #meter { position: absolute; right: 44px; bottom: 40px; display: none; --mc: var(--orange); }
  #meter.on { display: block; }
  #meter.blue { --mc: var(--blue); }
  #meter .ringbox { position: relative; width: 250px; height: 250px; }
  #meter svg { position: absolute; inset: 0; overflow: visible; }
  #meter .track { fill: none; stroke: var(--track); stroke-width: 16; }
  #meter .arc { fill: none; stroke: var(--mc); stroke-width: 16; filter: drop-shadow(0 0 10px var(--mc)); }
  #meter .disc { fill: var(--ink); }
  #meter .val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
                justify-content: center; padding-bottom: 10px; }
  #meter .val b { font-size: 76px; line-height: 1; }
  #meter .val i { font-size: 15px; font-style: normal; letter-spacing: 5px; color: var(--gold); margin-top: 2px; }
  #meter.full .arc { animation: fullpulse .8s ease-in-out infinite alternate; }
  @keyframes fullpulse { from { filter: drop-shadow(0 0 8px var(--mc)); } to { filter: drop-shadow(0 0 22px var(--mc)) brightness(1.3); } }
  #meter .barbox { display: none; width: 360px; padding: 12px 16px 14px; background: var(--ink); box-shadow: inset -4px 0 0 var(--mc);
                   clip-path: polygon(14px 0,100% 0,100% 100%,0 100%); box-sizing: border-box; }
  #meter.bar .ringbox { display: none; } #meter.bar .barbox { display: block; }
  #meter .barbox .row { display: flex; justify-content: space-between; align-items: baseline; padding-left: 10px; }
  #meter .barbox b { font-size: 46px; line-height: 1; }
  #meter .barbox i { font-size: 14px; font-style: normal; letter-spacing: 5px; color: var(--gold); }
  #meter .barbox .t { margin-top: 10px; height: 14px; background: var(--track); transform: skewX(-20deg); overflow: hidden; }
  #meter .barbox .f { height: 100%; width: 0; background: var(--mc); box-shadow: 0 0 14px var(--mc); transition: width .05s linear; }

  /* ---------- Intro: in .45s, hold, out .6s ---------- */
  #intro { position: absolute; inset: 0; display: none; }
  #intro.on { display: block; }
  #intro .band { position: absolute; left: 0; right: 0; top: 330px; height: 420px; }
  #intro .half { position: absolute; top: 0; bottom: 0; width: 50%; box-sizing: border-box; display: flex; align-items: center; }
  #intro .h-l { left: 0; padding: 56px 119px 0 0; justify-content: flex-end; background: linear-gradient(90deg, var(--blue) 0%, var(--ink) 56%); }
  #intro .h-r { right: 0; padding: 56px 0 0 119px; background: linear-gradient(90deg, var(--ink) 44%, var(--orange) 100%); }
  #intro .names { width: 760px; display: flex; flex-direction: column; gap: 4px; }
  #intro .h-l .names { align-items: flex-end; } #intro .h-r .names { align-items: flex-start; }
  #intro .side { font-size: 16px; letter-spacing: 6px; padding: 3px 14px; clip-path: polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }
  #intro .h-l .side { background: var(--blue); } #intro .h-r .side { background: var(--orange); }
  #intro .nm { font-size: 82px; line-height: 1.04; white-space: nowrap; flex: none; }
  #intro .sheen { position: absolute; top: 0; bottom: 0; left: 0; width: 300px;
                  background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); }
  #intro .head { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font-size: 28px; letter-spacing: 10px; }
  #intro .head span { color: var(--gold); }
  #intro .vsbox { position: absolute; left: 901px; top: 568px; width: 118px; height: 118px; }
  #intro .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid #fff; }
  #intro .vs { position: absolute; inset: 0; border-radius: 50%; border: 5px solid #fff; box-sizing: border-box; background: var(--ink);
               display: flex; align-items: center; justify-content: center; font-size: 46px;
               box-shadow: -10px 0 24px var(--blue), 10px 0 24px var(--orange); }

  #intro .band { animation: bandIn .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes bandIn { 0% { clip-path: polygon(0 50%,100% 50%,100% 50%,0 50%); filter: brightness(2.2); }
                      100% { clip-path: polygon(0 8%,100% 0,100% 92%,0 100%); filter: none; } }
  #intro .head { animation: fadeDown .35s .2s ease-out both; }
  @keyframes fadeDown { 0% { opacity: 0; transform: translateY(-16px); letter-spacing: 24px; } 100% { opacity: 1; transform: none; letter-spacing: 10px; } }
  #intro .h-l .names > * { animation: fromL .4s cubic-bezier(.15,.9,.25,1) both; }
  #intro .h-r .names > * { animation: fromR .4s cubic-bezier(.15,.9,.25,1) both; }
  #intro .names > :nth-child(2) { animation-delay: .18s; }
  #intro .names > :nth-child(3) { animation-delay: .24s; }
  #intro .names > :nth-child(4) { animation-delay: .30s; }
  @keyframes fromL { 0% { opacity: 0; transform: translateX(-140px) skewX(-14deg); } 70% { opacity: 1; transform: translateX(8px) skewX(3deg); } 100% { transform: none; } }
  @keyframes fromR { 0% { opacity: 0; transform: translateX(140px) skewX(14deg); } 70% { opacity: 1; transform: translateX(-8px) skewX(-3deg); } 100% { transform: none; } }
  #intro .vs { animation: vsPop .45s .28s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes vsPop { 0% { opacity: 0; transform: scale(2.4) rotate(-25deg); } 100% { opacity: 1; transform: none; } }
  #intro .ring { animation: ring .7s .4s ease-out both; }
  @keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.2); } }
  #intro .sheen { animation: sheen .7s .3s ease-in-out both; }
  @keyframes sheen { 0% { transform: translateX(-120%) skewX(-20deg); } 100% { transform: translateX(220%) skewX(-20deg); } }
  /* Out: VS pinches shut, then the band splits at the seam and each half launches off its own side. */
  #intro.out .h-l { animation: splitL .6s cubic-bezier(.55,0,.35,1) both; }
  #intro.out .h-r { animation: splitR .6s cubic-bezier(.55,0,.35,1) both; }
  @keyframes splitL { 0% { transform: none; } 20% { transform: translateX(14px); } 100% { transform: translateX(-1150px) skewX(-18deg); } }
  @keyframes splitR { 0% { transform: none; } 20% { transform: translateX(-14px); } 100% { transform: translateX(1150px) skewX(18deg); } }
  #intro.out .vs { animation: vsPinch .16s cubic-bezier(.5,0,.75,0) both; }
  @keyframes vsPinch { 0% { transform: none; } 40% { transform: scale(1.08); } 100% { transform: scale(0) rotate(25deg); opacity: 0; } }
  #intro.out .head { animation: headOut .3s .08s cubic-bezier(.5,0,.75,0) both; }
  @keyframes headOut { 100% { opacity: 0; transform: translateY(-24px); } }
  #intro.out .ring, #intro.out .sheen { display: none; }
</style>
</head>
<body>
<div id="score">
  <div id="bar">
    <div class="tname blue">BLUE TEAM</div><div class="tscore blue num" id="sblue">0</div>
    <div id="clock" class="num">5:00</div>
    <div class="tscore orange num" id="sorange">0</div><div class="tname orange">ORANGE TEAM</div>
    <div id="wipe">GOAL!</div>
  </div>
  <div id="strip"><div id="label"></div><div id="brand"><svg width="18" height="13" viewBox="0 0 18 13">
    <rect x=".5" y=".5" width="17" height="12" rx="3" fill="#ff3b3b"/><path d="M7 3.5v6l5-3z" fill="#fff"/></svg><span></span></div></div>
</div>
<div class="players" id="pblue"></div>
<div class="players" id="porange"></div>
<div id="stats"></div>
<div id="meter"><div class="ringbox"><svg viewBox="0 0 250 250">
    <circle class="disc" cx="125" cy="125" r="92"/>
    <circle class="track" cx="125" cy="125" r="108"/><circle class="arc" cx="125" cy="125" r="108"/></svg>
    <div class="val"><b class="num">0</b><i>BOOST</i></div></div>
  <div class="barbox"><div class="row"><i>BOOST</i><b class="num">0</b></div><div class="t"><div class="f"></div></div></div></div>
<div id="intro"><div class="band">
  <div class="half h-l"><div class="names"></div></div><div class="half h-r"><div class="names"></div></div>
  <div class="sheen"></div><div class="head"></div></div>
  <div class="vsbox"><div class="ring"></div><div class="vs">VS</div></div></div>

<script>
  const q = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  $("brand").querySelector("span").textContent = q.get("brand") || "Like, comment & subscribe!";
  const setLabel = t => { $("label").textContent = t; $("label").style.display = t ? "" : "none"; };
  setLabel(q.get("label") || "");
  const HOLD = parseFloat(q.get("hold")) || 4;
  const r = document.documentElement.style;
  if (q.get("scale")) r.setProperty("--scale", q.get("scale"));
  if (q.get("top")) r.setProperty("--top", q.get("top") + "px");

  // Boost meter: a 270-degree arc (open at the bottom), like the game's.
  const R = 108, CIRC = 2 * Math.PI * R, SPAN = .75 * CIRC, TICKS = 30, GAP = 4;
  // Dash pattern for the first n of TICKS ticks, then nothing for the rest of the circle.
  const ticks = n => Array.from({ length: TICKS }, (_, i) => i < n ? `${SPAN / TICKS - GAP} ${GAP}` : `0 ${SPAN / TICKS}`)
                          .join(" ") + ` 0 ${CIRC}`;
  function meterShape(kind) {
    const m = $("meter");
    m.classList.toggle("on", !!kind && kind !== "off");
    m.classList.toggle("bar", kind === "bar");
    m.dataset.kind = kind || "off";
    for (const el of m.querySelectorAll(".arc, .track"))
      el.setAttribute("transform", "rotate(135 125 125)");  // from bottom-left round to bottom-right
    m.querySelector(".track").style.strokeDasharray = kind === "segments" ? ticks(TICKS) : `${SPAN} ${CIRC}`;
    m.querySelector(".arc").style.strokeLinecap = kind === "segments" ? "butt" : "round";
  }
  function meterValue(boost, team) {
    const m = $("meter");
    if (!m.classList.contains("on") || boost == null || boost < 0) return;
    const v = Math.max(0, Math.min(100, boost));
    m.classList.toggle("blue", team === 0);
    m.classList.toggle("full", v >= 100);
    for (const b of m.querySelectorAll("b")) b.textContent = Math.floor(v);
    m.querySelector(".f").style.width = v + "%";
    m.querySelector(".arc").style.strokeDasharray =
      m.dataset.kind === "segments" ? ticks(Math.ceil(TICKS * v / 100)) : `${SPAN * v / 100} ${CIRC}`;
  }
  meterShape(q.get("meter") || "off");

  let last = {};

  function fmtClock(s, ot) {
    s = Math.max(0, Math.ceil(s));
    return (ot ? "+" : "") + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function playerCard(p) {
    const el = document.createElement("div");
    el.className = "pl" + (p.pov ? " pov" : "");
    el.innerHTML = `<div class="row"><span class="nm"></span>`
                 + `<span class="bn num"></span></div><div class="track"><div class="fill"></div></div>`;
    el.querySelector(".nm").textContent = p.name;
    return el;
  }

  // Goal: the wipe covers the bar and the score changes under it.
  const goalTimers = [];
  function goal(side, score) {
    goalTimers.splice(0).forEach(clearTimeout);
    const wipe = $("wipe"), sc = $("s" + side);
    wipe.className = ""; void wipe.offsetWidth;  // restart the animation
    wipe.style.setProperty("--gc", `var(--${side})`);
    wipe.className = side;
    goalTimers.push(setTimeout(() => { sc.textContent = score; }, 500));  // fully covered from 0.36 s to 0.84 s
    goalTimers.push(setTimeout(() => { wipe.className = ""; }, 1250));
  }

  // state: {score:{blue,orange}, clock (seconds), overtime, players:[{name,team:0|1,boost,pov}],
  //         stats:{name,score,goals,assists,saves,shots}, label}
  function render(state) {
    for (const side of ["blue", "orange"]) {
      const v = state.score[side];
      if (last.score && v > last.score[side]) goal(side, v);
      else if (!last.score || v !== last.score[side]) $("s" + side).textContent = v;
    }
    $("clock").textContent = fmtClock(state.clock, state.overtime);
    $("clock").classList.toggle("ot", !!state.overtime);
    const key = state.players.map(p => p.name + p.team + p.pov).join("|");
    if (key !== last.key) {  // (re)build the cards when the players change
      for (const [side, t] of [["blue", 0], ["orange", 1]]) {
        const box = $("p" + side); box.innerHTML = "";
        for (const p of state.players.filter(p => p.team === t)) box.appendChild(playerCard(p));
      }
    }
    for (const [side, t] of [["blue", 0], ["orange", 1]]) {
      const cards = $("p" + side).children, ps = state.players.filter(p => p.team === t);
      ps.forEach((p, i) => { if (p.boost < 0) return;  // car demolished: keep the last value
                             cards[i].querySelector(".fill").style.width = p.boost + "%";
                             cards[i].querySelector(".bn").textContent = Math.round(p.boost);
                             cards[i].classList.toggle("full", p.boost >= 100); });
    }
    const pov = state.players.find(p => p.pov);
    const s = state.stats;
    if (s) {
      $("stats").innerHTML = `<div class="who"></div><div class="sts">` + [["score", "SCORE"], ["goals", "G"], ["assists", "A"], ["saves", "SV"], ["shots", "SH"]]
        .map(([k, l]) => `<div class="st"><b class="num">${s[k]}</b><i>${l}</i></div>`).join("") + `</div>`;
      $("stats").querySelector(".who").textContent = s.name;
      const p = state.players.find(p => p.name === s.name) || pov;
      if (p) $("stats").classList.toggle("blue", p.team === 0);
    }
    if (pov) meterValue(pov.boost, pov.team);
    if (state.label != null) setLabel(state.label);
    last = { score: { ...state.score }, key };
  }

  // Intro: the band opens, names slide in, hold, then the band splits off both sides.
  function intro({ match, pov, blue, orange }) {
    const box = $("intro");
    box.querySelector(".head").innerHTML = `MATCH ${match} <span>/</span> `;
    box.querySelector(".head").append(`${String(pov).toUpperCase()} POV`);
    box.classList.remove("on", "out"); void box.offsetWidth;  // restart the animations
    box.classList.add("on");  // shown before filling, so the names can be measured
    const base = Math.max(blue.length, orange.length) > 2 ? 64 : 82;  // 3v3: keep the stack clear of the header
    for (const [cls, names, tag] of [["h-l", blue, "BLUE"], ["h-r", orange, "ORANGE"]]) {
      const el = box.querySelector(`.${cls} .names`);
      el.innerHTML = `<div class="side">${tag}</div>`;
      for (const n of names) {
        const d = document.createElement("div"); d.className = "nm"; d.textContent = n;
        let size = base; d.style.fontSize = size + "px"; el.appendChild(d);
        while (d.getBoundingClientRect().width > 760 && size > 30) d.style.fontSize = --size + "px";
      }
    }
    const t = [];
    t.push(setTimeout(() => box.classList.add("out"), 450 + HOLD * 1000));
    t.push(setTimeout(() => box.classList.remove("on", "out"), 450 + HOLD * 1000 + 650));
    return t;
  }
  window.render = render; window.intro = intro;

  // ---------- Live data ----------
  if (q.get("demo") !== "1") {
    let introId = null, busy = false, offSince = null;
    document.body.classList.add("off");
    setInterval(async () => {
      if (busy) return;
      busy = true;
      try {
        const st = await (await fetch("/state", { cache: "no-store" })).json();
        // Hide only after "not in a replay" has lasted 0.5 s (a loading screen),
        // never for a single odd reading: that would flicker.
        const live = st.in_replay && st.players;
        if (live) { offSince = null; document.body.classList.remove("off"); render(st); }
        else if (offSince === null) offSince = Date.now();
        else if (Date.now() - offSince > 500) document.body.classList.add("off");
        if (st.intro && st.intro.id !== introId) {
          if (introId !== null || st.intro.fresh) intro(st.intro);  // not on a page reload mid-game
          introId = st.intro.id;
        }
      } catch (e) { /* server not up yet */ }
      busy = false;
    }, 33);  // ~30 times a second, matching the plugin
  }

  // ---------- Demo data ----------
  if (q.get("demo") === "1") {
    if (!q.get("label")) setLabel("SSL 2v2");
    const DEMO = {
      score: { blue: 1, orange: 1 }, clock: 251, overtime: false,
      players: [{ name: "TempoH", team: 0, boost: 40 }, { name: "Joyo", team: 0, boost: 75 },
                { name: "Atow", team: 1, boost: 33, pov: true }, { name: "Arsenal✟", team: 1, boost: 90 }],
      stats: { name: "Atow", score: 245, goals: 1, assists: 1, saves: 2, shots: 3 },
    };
    const targets = DEMO.players.map(p => p.boost);
    render(DEMO);
    intro({ match: 1, pov: "ATOW", blue: ["TempoH", "Joyo"], orange: ["Atow", "Arsenal✟"] });
    setInterval(() => {  // boost drifts toward random targets, like real play
      DEMO.players.forEach((p, i) => {
        if (Math.random() < .04) targets[i] = Math.random() < .3 ? 100 : Math.random() * 100;
        p.boost += Math.sign(targets[i] - p.boost) * Math.min(Math.abs(targets[i] - p.boost), 3);
      });
      render(DEMO);
    }, 100);
    setInterval(() => { DEMO.clock = DEMO.clock > 0 ? DEMO.clock - 1 : 0; }, 1000);
    setInterval(() => { const s = Math.random() < .5 ? "blue" : "orange"; DEMO.score[s]++;
                        if (s === "orange") { DEMO.stats.goals++; DEMO.stats.score += 100; DEMO.stats.shots++; } }, 9000);
    window.replayIntro = () => intro({ match: 1, pov: "ATOW", blue: ["TempoH", "Joyo"], orange: ["Atow", "Arsenal✟"] });
  }
</script>
</body>
</html>
